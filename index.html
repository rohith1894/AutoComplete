<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trie Autocomplete</title>
    <meta name="description" content="Autocomplete over 370k English words using a Trie, with a live visualization of the traversal.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="brand">
            <span class="logo">T</span>
            <div>
                <h1>Trie Autocomplete</h1>
                <p>Prefix search over <span id="word-count">370,000+</span> English words</p>
            </div>
        </div>
        <a class="gh" href="https://github.com/rohith1894/AutoComplete" target="_blank" rel="noopener">View source</a>
    </header>

    <main class="layout">
        <section class="panel search-panel">
            <label for="search" class="label">Type a prefix</label>
            <div class="input-wrap">
                <input id="search" type="text" class="input" placeholder="e.g. algo" autocomplete="off" spellcheck="false" disabled>
                <span class="status" id="status">Loading dictionary…</span>
            </div>
            <div class="stats" id="stats"></div>
            <div class="display-result" id="results"></div>
        </section>

        <section class="panel viz-panel">
            <div class="viz-head">
                <div>
                    <h2>Traversal</h2>
                    <p class="hint">Walk down the prefix path, then depth-first search the subtree to collect words.</p>
                </div>
                <div class="controls">
                    <button id="replay" type="button" disabled>Replay</button>
                    <label class="speed">Speed
                        <input id="speed" type="range" min="1" max="5" value="3">
                    </label>
                </div>
            </div>
            <div class="legend">
                <span><i class="dot path"></i>Prefix path</span>
                <span><i class="dot dfs"></i>DFS visit</span>
                <span><i class="dot end"></i>End of word</span>
                <span><i class="dot more"></i>Hidden branches</span>
            </div>
            <div class="viz-scroll" id="viz-scroll">
                <svg id="viz" role="img" aria-label="Trie traversal visualization"></svg>
                <div class="empty" id="viz-empty">Start typing to see how the trie is searched.</div>
            </div>
            <div class="log" id="log"></div>
        </section>
    </main>

    <script src="search.js"></script>
</body>
</html>
